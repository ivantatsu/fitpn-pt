name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fitpn
          POSTGRES_PASSWORD: fitpn
          POSTGRES_DB: fitpn_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitpn" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formato
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Tests
        env:
          TEST_DATABASE_URL: postgres://fitpn:fitpn@localhost:5432/fitpn_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o bin/fitpn-api ./cmd/api

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Formato
        run: npm run format:check
      - name: Tests
        run: npx ng test --watch=false
      - name: Build
        run: npx ng build
